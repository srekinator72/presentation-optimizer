<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presentation Optimizer</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=2.0.0-2a108536a2" />
</head>
<body>
  <section id="sideload-msg" class="optimizer">
    <p class="status">Загрузка Presentation Optimizer…</p>
  </section>

  <main id="app-body" class="optimizer" style="display:none">
    <h1>Presentation Optimizer</h1>
    <p class="lead">Покажет, что утяжеляет презентацию и как это исправить. Файл не меняется и никуда не отправляется.</p>

    <button id="run" class="analyze-button" type="button">Найти проблемы</button>
    <div id="progress" class="progress" hidden><div></div></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="results" aria-live="polite"></div>

    <p class="optimizer-footer">Идея и первая версия — Варя Васильева.<br>Доработка — Егор Пляцевой.<br>Версия 2.0.0.</p>
  </main>

  <script src="taskpane.js?v=2.0.0-2a108536a2"></script>
</body>
</html>
